<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bakılı · Расходы</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#F6F1EA; --card:#FFFFFF; --line:#E6DCCF; --ink:#1E1A17; --muted:#6B6058; --accent:#B8362F; --accent-dark:#8E2823;
    --gold:#D4A24C; --gold-bg:#F3E3C3; --gold-ink:#7A5A1E; --blue-bg:#DDE9F0; --blue-ink:#2F5A72; --red-bg:#F2D7D5; --grey-bg:#E8E3DC; --grey-ink:#4A423C;
    --dark:#1E1A17; --dark-text:#F6F1EA; --dark-muted:#C9BDB0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  button,input,select,textarea{font:inherit}
  .wrap{max-width:560px;margin:0 auto;padding:0 20px}
  header{display:flex;justify-content:space-between;align-items:flex-end;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:12px}
  .eyebrow{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  h1{margin:0;font-family:'Playfair Display',serif;font-weight:600;font-size:32px;line-height:1.1}
  .tabs{display:flex;gap:8px;margin-top:4px}
  .tab{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;font-size:13px;cursor:pointer}
  .tab[aria-pressed="true"]{background:var(--ink);color:var(--dark-text);border-color:var(--ink)}
  .summary{margin-top:14px;padding:18px 18px 16px;border-radius:20px;background:var(--dark);color:var(--dark-text);display:flex;flex-direction:column;gap:14px}
  .summary .row{display:flex;justify-content:space-between;font-size:13px;color:var(--dark-muted)}
  .summary .total{display:flex;align-items:baseline;gap:10px}
  .summary .total b{font-family:'Playfair Display',serif;font-weight:500;font-size:40px;line-height:1}
  .summary .total span{font-size:14px;color:var(--dark-muted)}
  .bar{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px}
  .bar div{min-width:2px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--dark-muted)}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:4px;margin-right:6px;vertical-align:1px}
  .section{margin-top:20px;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700}
  .section small{font-weight:600;color:var(--muted)}
  .list{margin-top:10px;display:flex;flex-direction:column;gap:8px}
  .item{padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:12px;text-align:left;width:100%;cursor:pointer;color:var(--ink)}
  .item .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:18px}
  .item .body{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:2px}
  .item .t{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .m{font-size:12px;color:var(--muted)}
  .item .amt{font-size:16px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
  .empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:16px}
  .fab{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:30px;border:0;background:var(--accent);color:#fff;font-size:30px;line-height:1;cursor:pointer;box-shadow:0 8px 20px rgba(184,54,47,.3)}
  .scrim{position:fixed;inset:0;background:rgba(30,26,23,.45);display:none}
  .scrim.open{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:24px 24px 0 0;padding:14px 20px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .22s ease;max-width:560px;margin:0 auto}
  .sheet.open{transform:none}
  .grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
  .sheet h2{margin:0 0 14px;font-family:'Playfair Display',serif;font-weight:600;font-size:24px}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
  .field label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .field input{width:100%;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--bg);padding:0 14px;font-size:17px;font-weight:600;color:var(--ink);outline:0}
  .field input:focus{border-color:var(--ink)}
  .amount-wrap{position:relative}
  .amount-wrap input{padding-right:48px;font-size:28px;font-family:'Playfair Display',serif;font-weight:500;height:64px}
  .amount-wrap span{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--muted)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--dark-text);border-color:var(--ink)}
  .actions{display:flex;gap:8px;margin-top:6px}
  .btn{flex:1 1 0;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:15px;cursor:pointer}
  .btn.primary{background:var(--ink);color:var(--dark-text);border-color:var(--ink)}
  .btn.danger{color:var(--accent-dark);border-color:var(--red-bg);background:var(--red-bg)}
  .btn:disabled{opacity:.5}
  .save-notice{padding:12px 14px;border-radius:12px;background:var(--gold-bg);color:var(--gold-ink);font-size:13px;line-height:1.5;margin:12px 0}
  .resume{width:100%;margin-top:14px}
  .delivery{font-size:12px;color:var(--muted);margin-top:4px;white-space:normal}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--dark-text);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .gate{padding:60px 24px;text-align:center}
  .gate h1{font-size:28px;margin-bottom:10px}
  .gate p{color:var(--muted);line-height:1.5}
  @media (prefers-color-scheme: dark){
    :root{color-scheme:dark;--bg:#17120F;--card:#241C18;--line:#352A24;--ink:#F3EAE0;--muted:#B5A698;--dark:#2B1E1A;--dark-text:#F3EAE0;--dark-muted:#B5A698;
      --gold-bg:#3D2E16;--gold-ink:#E8B65A;--blue-bg:#1E2F3A;--blue-ink:#8FB3C9;--red-bg:#3D1F1E;--grey-bg:#2E2621;--grey-ink:#C9BDB0}
    .tab[aria-pressed="true"],.chip[aria-pressed="true"],.btn.primary{background:#F3EAE0;color:#17120F;border-color:#F3EAE0}
    .toast{background:#F3EAE0;color:#17120F}
  }
</style>
</head>
<body>
<div id="app" class="wrap" hidden>
  <header>
    <div>
      <div class="eyebrow" id="eyebrow">Bakılı</div>
      <h1>Расходы</h1>
    </div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-period="day" aria-pressed="true">Сегодня</button>
    <button class="tab" role="tab" data-period="week" aria-pressed="false">7 дней</button>
    <button class="tab" role="tab" data-period="month" aria-pressed="false">Месяц</button>
  </div>

  <div class="summary">
    <div class="row"><span id="period-label">Сегодня</span><span id="month-total"></span></div>
    <div class="total"><b id="total">—</b><span id="count"></span></div>
    <div class="bar" id="bar"></div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="section"><span>Записи</span><small id="pending"></small></div>
  <div class="list" id="list"></div>
  <button class="btn resume" id="resume" hidden>Проверить сохранение покупки</button>
</div>

<div id="gate" class="gate wrap" hidden>
  <h1>Bakılı · Расходы</h1>
  <p id="gate-text">Открой приложение из Telegram — через /app в группе бара.</p>
</div>

<button class="fab" id="fab" aria-label="Добавить расход" hidden>+</button>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="grip"></div>
  <h2 id="sheet-title">Новый расход</h2>
  <div class="field">
    <label for="f-amount">Сумма</label>
    <div class="amount-wrap"><input id="f-amount" inputmode="decimal" placeholder="0" autocomplete="off"><span>₼</span></div>
  </div>
  <div class="field">
    <label for="f-text">Что купили</label>
    <input id="f-text" placeholder="лаймы 2 кг, мята" autocomplete="off" maxlength="1000">
  </div>
  <div class="field">
    <label>Категория</label>
    <div class="chips" id="cats"></div>
  </div>
  <div class="field">
    <label for="f-need">Закрыть заявку № (необязательно)</label>
    <input id="f-need" inputmode="numeric" placeholder="14" autocomplete="off">
  </div>
  <div class="save-notice" id="save-notice" role="status" hidden></div>
  <div class="actions">
    <button class="btn danger" id="btn-delete" hidden>Удалить</button>
    <button class="btn" id="btn-cancel">Отмена</button>
    <button class="btn primary" id="btn-save">Записать</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const API = "https://worker-production-0beb.up.railway.app";
const CAT = {
  "бар":        {icon:"🍾", bg:"var(--gold-bg)", color:"var(--gold)"},
  "расходники": {icon:"🧻", bg:"var(--blue-bg)", color:"#8FB3C9"},
  "ремонт":     {icon:"🔧", bg:"var(--red-bg)",  color:"var(--accent)"},
  "оборудование":{icon:"📦", bg:"var(--grey-bg)", color:"#9A8E84"},
  "прочее":     {icon:"•",  bg:"var(--grey-bg)", color:"#C9BDB0"},
  "без описания":{icon:"❔", bg:"var(--gold-bg)", color:"var(--gold-ink)"},
};
const tg = window.Telegram && window.Telegram.WebApp;
const initData = tg && tg.initData || "";
const devToken = new URLSearchParams(location.search).get("dev") || "";

const $ = (s) => document.querySelector(s);
let period = "day", editing = null, category = null;
let saving = false, pendingCreate = null, pendingStorageKey = "", refreshTimer = null;

function money(x){ return (Math.round(x*100)/100).toLocaleString("ru-RU",{minimumFractionDigits:0,maximumFractionDigits:2}) + " ₼"; }
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("show"); setTimeout(()=>el.classList.remove("show"),1800); }
function haptic(kind){ try{ tg && tg.HapticFeedback && (kind==="ok" ? tg.HapticFeedback.notificationOccurred("success") : tg.HapticFeedback.impactOccurred("light")); }catch(e){} }

async function api(path, opts={}){
  const headers = {"Content-Type":"application/json", ...opts.headers};
  if (initData) headers["X-Telegram-Init-Data"] = initData;
  if (devToken) headers["X-Dev-Token"] = devToken;
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 15000);
  try {
    const r = await fetch(API + path, {...opts, headers, signal:controller.signal});
    const data = await r.json();
    if (!r.ok) { const error = new Error(data.error || ("Ошибка " + r.status)); error.status = r.status; throw error; }
    return data;
  } finally { clearTimeout(timer); }
}

function labelFor(p){ return p==="day" ? "Сегодня" : p==="week" ? "7 дней" : "Месяц"; }

function render(d){
  clearTimeout(refreshTimer);
  if (d.items.some(it => it.notification_status === "pending" || it.need_status === "pending")) {
    refreshTimer = setTimeout(load, 30000);
  }
  $("#period-label").textContent = labelFor(d.period);
  $("#month-total").textContent = "за месяц " + money(d.month_total);
  $("#total").textContent = money(d.total);
  $("#count").textContent = d.count + " " + plural(d.count, ["запись","записи","записей"]);
  $("#pending").textContent = d.pending ? "❓ без суммы: " + d.pending + " — в топике «Расходы»" : "";
  const cats = Object.entries(d.by_category);
  $("#bar").innerHTML = cats.map(([c,v]) => `<div style="flex:${v} 0 0;background:${(CAT[c]||CAT["прочее"]).color}"></div>`).join("");
  $("#legend").innerHTML = cats.map(([c,v]) => `<span><i style="background:${(CAT[c]||CAT["прочее"]).color}"></i>${c} ${money(v)}</span>`).join("");
  const list = $("#list");
  if (!d.items.length){ list.innerHTML = `<div class="empty">Пока пусто. Плюс внизу — первая запись.</div>`; return; }
  list.innerHTML = d.items.map(it => {
    const c = CAT[it.category] || CAT["прочее"];
    const need = it.need_id ? "заявка #" + it.need_id + (it.need_status === "pending" ? " · закрытие ожидается" : it.need_status === "not_found" ? " · не найдена" : "") : "";
    const meta = [it.who, it.date.slice(0,5) + " " + it.date.slice(11), need, it.photo ? "чек" : ""].filter(Boolean).join(" · ");
    const delivery = it.notification_status === "pending" ? "Сохранено · уведомление в Telegram ожидает отправки" : "";
    return `<button class="item" data-id="${it.id}">
      <div class="ic" style="background:${c.bg}">${c.icon}</div>
      <div class="body"><div class="t">${esc(it.text)}</div><div class="m">${esc(meta)}</div>${delivery ? `<div class="delivery">${delivery}</div>` : ""}</div>
      <div class="amt">${money(it.amount)}</div></button>`;
  }).join("");
  list.querySelectorAll(".item").forEach(b => b.addEventListener("click", () => openSheet(d.items.find(i => i.id == b.dataset.id))));
}
function esc(s){ return String(s).replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch])); }
function plural(n, f){ const m10=n%10, m100=n%100; return (m10===1&&m100!==11)?f[0]:(m10>=2&&m10<=4&&(m100<10||m100>=20))?f[1]:f[2]; }

async function load(){
  try { render(await api("/api/expenses?period=" + period)); }
  catch(e){ toast(e.message); }
}

function renderCats(){
  $("#cats").innerHTML = `<button class="chip" data-cat="" aria-pressed="${category===null}">авто</button>` +
    Object.keys(CAT).filter(c => c!=="без описания").map(c => `<button class="chip" data-cat="${c}" aria-pressed="${category===c}">${CAT[c].icon} ${c}</button>`).join("");
  $("#cats").querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => { category = b.dataset.cat || null; renderCats(); haptic(); }));
}

function updateSaveState(){
  const locked = saving || !!pendingCreate;
  ["#f-amount", "#f-text", "#f-need"].forEach(id => $(id).disabled = locked);
  $("#cats").querySelectorAll(".chip").forEach(b => b.disabled = locked);
  $("#btn-save").disabled = saving;
  $("#btn-delete").disabled = saving;
  $("#btn-cancel").disabled = saving;
  $("#btn-save").textContent = saving ? "Сохраняем…" : pendingCreate ? "Проверить сохранение" : editing ? "Сохранить" : "Записать";
  $("#resume").hidden = !pendingCreate;
}

function forgetPending(){
  pendingCreate = null;
  try { localStorage.removeItem(pendingStorageKey); } catch(e) { /* A replay is still safe. */ }
}

function openSheet(item){
  if (saving) return;
  if (pendingCreate) item = null;
  editing = item || null;
  $("#sheet-title").textContent = item ? "Запись #" + item.id : "Новый расход";
  $("#f-amount").value = item ? item.amount : "";
  $("#f-text").value = item ? item.text : "";
  $("#f-need").value = item ? (item.need_id || "") : "";
  $("#f-need").parentElement.hidden = !!item;
  category = item ? item.category : null;
  if (pendingCreate) {
    $("#f-amount").value = pendingCreate.body.amount;
    $("#f-text").value = pendingCreate.body.text;
    $("#f-need").value = pendingCreate.body.need_id;
    category = pendingCreate.body.category;
  }
  renderCats();
  $("#btn-delete").hidden = !item;
  $("#btn-save").textContent = item ? "Сохранить" : "Записать";
  $("#save-notice").hidden = !pendingCreate;
  $("#save-notice").textContent = pendingCreate ? "Ответ о сохранении не получен. Проверь эту покупку — повторная запись не появится." : "";
  updateSaveState();
  $("#scrim").classList.add("open"); $("#sheet").classList.add("open");
  tg && tg.BackButton && tg.BackButton.show();
  setTimeout(() => (item ? $("#f-text") : $("#f-amount")).focus(), 250);
}
function closeSheet(){ if (saving) return; $("#scrim").classList.remove("open"); $("#sheet").classList.remove("open"); tg && tg.BackButton && tg.BackButton.hide(); editing = null; $("#fab").focus(); }

async function save(){
  if (saving || !$("#sheet").classList.contains("open")) return;
  const amount = Number($("#f-amount").value.replace(",", "."));
  const text = $("#f-text").value.trim();
  if (!Number.isFinite(amount) || !(amount > 0)) return toast("Сумма — число больше нуля");
  if (!text || text.length > 1000) return toast("Описание покупки — от 1 до 1000 символов");
  const wasEditing = !!editing;
  if (!wasEditing && !pendingCreate) {
    const need_id = $("#f-need").value.trim().replace(/^#/, "");
    if (need_id && (!/^[0-9]{1,15}$/.test(need_id) || Number(need_id) < 1)) return toast("Номер заявки — целое число больше нуля");
    const draft = {key:crypto.randomUUID(), body:{amount, text, category, need_id}};
    try { localStorage.setItem(pendingStorageKey, JSON.stringify(draft)); }
    catch(e){ return toast("Не удалось сохранить покупку на устройстве. Разреши хранилище и попробуй снова."); }
    pendingCreate = draft;
  }
  saving = true; updateSaveState(); $("#save-notice").hidden = true;
  try {
    let result;
    if (editing) await api("/api/expenses/" + editing.id, {method:"PATCH", body: JSON.stringify({amount, text, category})});
    else {
      result = await api("/api/expenses", {method:"POST", headers:{"Idempotency-Key":pendingCreate.key}, body:JSON.stringify(pendingCreate.body)});
      if (!Number.isInteger(result.id) || result.id < 1) throw new Error("Нет подтверждения сохранения");
      forgetPending();
    }
    saving = false; updateSaveState(); haptic("ok"); closeSheet();
    await load(); toast(result && result.deleted ? "Эта покупка уже была сохранена и удалена" : wasEditing ? "Сохранено" : "Расход сохранён");
  } catch(e){
    // Only a validation response proves that no append happened. Network/5xx/auth
    // errors keep the SAME key and payload, including across a page reload.
    if (!wasEditing && e.status === 400) forgetPending();
    $("#save-notice").hidden = false;
    $("#save-notice").textContent = pendingCreate ? "Ответ о сохранении не получен. Нажми «Проверить сохранение» — повторной записи не будет." : e.message;
  }
  finally { saving = false; updateSaveState(); }
}
async function remove(){
  if (!editing || saving) return;
  try { await api("/api/expenses/" + editing.id, {method:"DELETE"}); haptic("ok"); closeSheet(); await load(); toast("Удалено"); }
  catch(e){ toast(e.message); }
}

async function boot(){
  if (tg) { tg.ready(); tg.expand(); tg.BackButton && tg.BackButton.onClick(closeSheet); }
  if (!initData && !devToken){ $("#gate").hidden = false; return; }
  try {
    const me = await api("/api/me");
    pendingStorageKey = "barbot:pending-expense:" + me.user.id;
    const stored = localStorage.getItem(pendingStorageKey);
    if (stored) {
      const draft = JSON.parse(stored);
      if (!draft || typeof draft.key !== "string" || !draft.body || !Number.isFinite(draft.body.amount) || typeof draft.body.text !== "string") throw new Error("Не удалось прочитать незавершённую покупку. Не создавай её повторно — проверь список расходов.");
      pendingCreate = draft;
    }
    $("#eyebrow").textContent = "Bakılı · " + (me.user.first_name || "команда");
    $("#app").hidden = false; $("#fab").hidden = false;
    await load();
    if (pendingCreate) openSheet(null);
  } catch(e){
    $("#gate").hidden = false; $("#gate-text").textContent = e.message;
  }
}

document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
  period = b.dataset.period; document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-pressed", x===b)); haptic(); load();
}));
$("#fab").addEventListener("click", () => openSheet(null));
$("#resume").addEventListener("click", () => openSheet(null));
$("#scrim").addEventListener("click", closeSheet);
$("#btn-cancel").addEventListener("click", closeSheet);
$("#btn-save").addEventListener("click", save);
$("#btn-delete").addEventListener("click", remove);
$("#f-amount").addEventListener("keydown", e => { if (e.key==="Enter") $("#f-text").focus(); });
$("#f-text").addEventListener("keydown", e => { if (e.key==="Enter") save(); });
boot();
</script>
</body>
</html>

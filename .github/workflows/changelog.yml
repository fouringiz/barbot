name: Changelog → Telegram

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post push to main into the «Обновления» topic
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GROUP_ID: ${{ secrets.TG_GROUP_ID }}
          TOPIC_ID: ${{ secrets.TG_TOPIC_CHANGELOG }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          HEAD_URL: ${{ github.event.head_commit.url }}
          HEAD_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMPARE_URL: ${{ github.event.compare }}
          COMMITS_JSON: ${{ toJson(github.event.commits) }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          python3 - <<'PY'
          import html, json, os, re, urllib.request

          esc = lambda s: html.escape(s or "")
          message = (os.environ.get("HEAD_MESSAGE") or "").strip()
          commits = json.loads(os.environ.get("COMMITS_JSON") or "[]")
          if not message:
              raise SystemExit("empty head commit, nothing to post")

          first, _, rest = message.partition("\n")
          m = re.search(r"\(#(\d+)\)\s*$", first)
          pr_number = m.group(1) if m else ""
          title = re.sub(r"\s*\(#\d+\)\s*$", "", first)

          kind = "🆕"
          if title.startswith("fix"):
              kind = "🛠"
          elif title.startswith(("chore", "refactor", "docs", "ci")):
              kind = "🧹"
          clean_title = re.sub(r"^\w+(\([^)]*\))?!?:\s*", "", title)

          # тело: markdown-список → маркеры, заголовки убираем, обрезаем
          lines = []
          for raw in rest.splitlines():
              line = raw.rstrip()
              if not line or line.startswith("#"):
                  continue
              line = re.sub(r"^\s*[-*]\s+", "• ", line)
              line = re.sub(r"`([^`]*)`", r"\1", line)
              line = re.sub(r"\*\*([^*]*)\*\*", r"\1", line)
              lines.append(line)
          summary = "\n".join(lines)
          if len(summary) > 1500:
              summary = summary[:1490].rstrip() + "…"

          link = f"{os.environ['REPO_URL']}/pull/{pr_number}" if pr_number else os.environ["HEAD_URL"]
          link_label = f"PR #{pr_number}" if pr_number else "коммит"
          extra = f" · коммитов: {len(commits)}" if len(commits) > 1 else ""

          text = (
              f"{kind} <b>{esc(clean_title)}</b>\n"
              f"<i>{esc(link_label)} · {esc(os.environ['HEAD_AUTHOR'])}{extra}</i>\n\n"
              f"{esc(summary) if summary else '—'}\n\n"
              f"<a href=\"{esc(link)}\">Открыть {esc(link_label)}</a> · приложение обновится через 2–3 минуты, переоткройте его"
          )

          payload = {
              "chat_id": os.environ["GROUP_ID"],
              "message_thread_id": int(os.environ["TOPIC_ID"]),
              "text": text,
              "parse_mode": "HTML",
              "disable_web_page_preview": True,
          }
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{os.environ['BOT_TOKEN']}/sendMessage",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              print(resp.status, resp.read()[:200])
          PY

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bakılı · Команда</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#F6F1EA; --card:#FFFFFF; --line:#E6DCCF; --ink:#1E1A17; --muted:#6B6058; --accent:#B8362F; --accent-dark:#8E2823;
    --gold:#D4A24C; --gold-bg:#F3E3C3; --gold-ink:#7A5A1E; --blue-bg:#DDE9F0; --blue-ink:#2F5A72; --red-bg:#F2D7D5; --red-ink:#8E2823;
    --grey-bg:#E8E3DC; --grey-ink:#4A423C; --dark:#1E1A17; --dark-text:#F6F1EA; --dark-muted:#C9BDB0; --nav:#FFFFFF;
    --toggle-off:#DED6CB;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
  button,input,select,textarea{font:inherit}
  .wrap{max-width:560px;margin:0 auto;padding:0 20px}
  header{display:flex;justify-content:space-between;align-items:flex-end;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:12px}
  .eyebrow{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  h1{margin:0;font-family:'Playfair Display',serif;font-weight:600;font-size:32px;line-height:1.1}
  .screen{display:none}.screen.active{display:block}
  .tabs{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
  .tab,.chip{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;font-size:13px;cursor:pointer}
  .chip{height:34px;padding:0 12px;border-radius:17px}
  .tab[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--ink);color:var(--dark-text);border-color:var(--ink)}
  .summary{margin-top:14px;padding:18px 18px 16px;border-radius:20px;background:var(--dark);color:var(--dark-text);display:flex;flex-direction:column;gap:14px}
  .summary .row{display:flex;justify-content:space-between;font-size:13px;color:var(--dark-muted)}
  .summary .total{display:flex;align-items:baseline;gap:10px}
  .summary .total b{font-family:'Playfair Display',serif;font-weight:500;font-size:40px;line-height:1}
  .summary .total span{font-size:14px;color:var(--dark-muted)}
  .bar{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px}.bar div{min-width:2px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--dark-muted)}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:4px;margin-right:6px;vertical-align:1px}
  .section{margin-top:20px;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .section.red{color:var(--red-ink)}
  .list{margin-top:10px;display:flex;flex-direction:column;gap:8px}
  .item{padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:12px;text-align:left;width:100%;cursor:pointer;color:var(--ink)}
  .item .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:18px}
  .item .body{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:2px}
  .item .t{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .m{font-size:12px;color:var(--muted)}
  .item .amt{font-size:16px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
  .empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:16px}
  .card{padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
  .card .top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
  .badge{padding:3px 9px;border-radius:8px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
  .card .text{font-size:16px;font-weight:600;line-height:1.3}
  .row2{display:flex;gap:8px}
  .btn{flex:1 1 0;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:14px;cursor:pointer}
  .btn.primary{background:var(--ink);color:var(--dark-text);border-color:var(--ink)}
  .btn.danger{color:var(--red-ink);border-color:var(--red-bg);background:var(--red-bg)}
  .btn:disabled{opacity:.5}
  .search{height:48px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px;margin-top:6px}
  .search input{flex:1 1 0;border:0;outline:0;background:transparent;font-weight:600;font-size:15px;color:var(--ink);min-width:0}
  .search svg{flex:0 0 auto}
  .toggle{width:52px;height:32px;border-radius:16px;border:0;background:var(--toggle-off);position:relative;cursor:pointer;flex:0 0 auto}
  .toggle span{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:13px;background:#fff;transition:left .15s}
  .toggle[aria-checked="true"]{background:var(--accent)}.toggle[aria-checked="true"] span{left:23px}
  .stoprow{padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  .stoprow .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .stoprow .nm{font-size:16px;font-weight:700}.stoprow .sub{font-size:12px;color:var(--muted)}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{padding:4px 10px;border-radius:8px;font-size:12px;font-weight:600;background:var(--red-bg);color:var(--red-ink)}
  .ingrow{height:52px;padding:0 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:600}
  .spec{margin-top:16px;padding:22px 20px 20px;border-radius:24px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:16px}
  .spec h2{margin:0;font-family:'Playfair Display',serif;font-weight:600;font-size:28px;line-height:1.05}
  .spec .sub{font-size:13px;color:var(--muted)}
  .ing{display:flex;justify-content:space-between;align-items:center;height:44px;border-bottom:1px solid var(--line);font-size:17px;font-weight:600}
  .ing:last-child{border-bottom:0}.ing b{font-variant-numeric:tabular-nums}
  .ing.dead{color:var(--red-ink);text-decoration:line-through}
  .meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .meta div{padding:10px 12px;border-radius:12px;background:var(--bg)}
  .meta label{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
  .meta span{font-size:13px;font-weight:600}
  .pitch{padding:14px 16px;border-radius:14px;background:var(--dark);color:var(--dark-text);font-size:14px;line-height:1.45}
  .fab{position:fixed;right:20px;bottom:calc(96px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:30px;border:0;background:var(--accent);color:#fff;font-size:30px;line-height:1;cursor:pointer;box-shadow:0 8px 20px rgba(184,54,47,.3)}
  nav.bottom{position:fixed;left:0;right:0;bottom:0;height:calc(82px + env(safe-area-inset-bottom,0px));padding:10px 8px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--nav);display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
  nav.bottom button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer}
  nav.bottom button[aria-current="page"]{color:var(--accent);font-weight:700}
  nav.bottom svg{width:22px;height:22px}
  .scrim{position:fixed;inset:0;background:rgba(30,26,23,.45);display:none}.scrim.open{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:24px 24px 0 0;padding:14px 20px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .22s ease;max-width:560px;margin:0 auto;max-height:92vh;overflow:auto}
  .sheet.open{transform:none}
  .grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
  .sheet h2{margin:0 0 14px;font-family:'Playfair Display',serif;font-weight:600;font-size:24px}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
  .field label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .field input{width:100%;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--bg);padding:0 14px;font-size:17px;font-weight:600;color:var(--ink);outline:0}
  .field input:focus{border-color:var(--ink)}
  .amount-wrap{position:relative}
  .amount-wrap input{padding-right:48px;font-size:28px;font-family:'Playfair Display',serif;font-weight:500;height:64px}
  .amount-wrap span{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--muted)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .actions{display:flex;gap:8px;margin-top:6px}
  .actions .btn{height:50px;font-size:15px}
  .save-notice{padding:12px 14px;border-radius:12px;background:var(--gold-bg);color:var(--gold-ink);font-size:13px;line-height:1.5;margin:0 0 12px}
  .resume{width:100%;margin-top:14px;height:50px}
  .delivery{font-size:12px;color:var(--gold-ink);margin-top:2px}
  .log{padding:10px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:13px;line-height:1.4}
  .log b{font-weight:700}.log .when{color:var(--muted);font-size:12px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--dark-text);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
  .toast.show{opacity:1}
  .gate{padding:60px 24px;text-align:center}.gate h1{font-size:28px;margin-bottom:10px}.gate p{color:var(--muted);line-height:1.5}
  @media (prefers-color-scheme: dark){
    :root{color-scheme:dark;--bg:#17120F;--card:#241C18;--line:#352A24;--ink:#F3EAE0;--muted:#B5A698;--dark:#2B1E1A;--dark-text:#F3EAE0;--dark-muted:#B5A698;--nav:#1D1714;
      --gold-bg:#3D2E16;--gold-ink:#E8B65A;--blue-bg:#1E2F3A;--blue-ink:#8FB3C9;--red-bg:#3D1F1E;--red-ink:#E89A95;--grey-bg:#2E2621;--grey-ink:#C9BDB0;--toggle-off:#4A3C34}
    .tab[aria-pressed="true"],.chip[aria-pressed="true"],.btn.primary{background:#F3EAE0;color:#17120F;border-color:#F3EAE0}
    .toast{background:#F3EAE0;color:#17120F}
  }
</style>
</head>
<body>
<div id="app" class="wrap" hidden>
  <header>
    <div><div class="eyebrow" id="eyebrow">Bakılı</div><h1 id="title">Расходы</h1></div>
  </header>

  <!-- ===== Расходы ===== -->
  <section class="screen" id="scr-expenses">
    <div class="tabs" role="tablist">
      <button class="tab" data-period="day" aria-pressed="true">Сегодня</button>
      <button class="tab" data-period="week" aria-pressed="false">7 дней</button>
      <button class="tab" data-period="month" aria-pressed="false">Месяц</button>
    </div>
    <div class="summary">
      <div class="row"><span id="period-label">Сегодня</span><span id="month-total"></span></div>
      <div class="total"><b id="total">—</b><span id="count"></span></div>
      <div class="bar" id="bar"></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="section"><span>Записи</span><small id="pending"></small></div>
    <div class="list" id="exp-list"></div>
    <button class="btn resume" id="resume" hidden>Проверить сохранение покупки</button>
    <div class="section" style="margin-top:24px"><span>Журнал действий</span><button class="chip" id="audit-toggle">показать</button></div>
    <div class="list" id="audit-list" hidden></div>
  </section>

  <!-- ===== Заявки ===== -->
  <section class="screen" id="scr-needs">
    <div class="tabs" id="need-filters"></div>
    <div class="list" id="need-list" style="margin-top:16px"></div>
  </section>

  <!-- ===== Стоп-лист ===== -->
  <section class="screen" id="scr-stop">
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="stop-q" placeholder="Ингредиент…" autocomplete="off">
      <button class="chip" id="stop-add-custom" hidden>в стоп</button>
    </div>
    <div class="section red"><span>Сейчас в стопе</span><small id="stop-count"></small></div>
    <div class="list" id="stop-list"></div>
    <div class="section"><span>Всё на баре</span></div>
    <div class="list" id="ing-list"></div>
  </section>

  <!-- ===== Спеки ===== -->
  <section class="screen" id="scr-specs">
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="spec-q" placeholder="негрони, paper plane, олдфешен…" autocomplete="off">
    </div>
    <div class="chips" id="spec-hits" style="margin-top:10px"></div>
    <div id="spec-card"></div>
  </section>
</div>

<div id="gate" class="gate wrap" hidden>
  <h1>Bakılı · Команда</h1>
  <p id="gate-text">Открой приложение из Telegram — через /app в группе бара.</p>
</div>

<button class="fab" id="fab" aria-label="Добавить" hidden>+</button>

<nav class="bottom" id="nav" hidden>
  <button data-screen="expenses"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>Расходы</button>
  <button data-screen="needs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>Заявки</button>
  <button data-screen="stop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M6 6l12 12"/></svg>Стоп</button>
  <button data-screen="specs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h8l-1 7a3 3 0 0 1-6 0z"/><path d="M12 13v7M8 20h8"/></svg>Спеки</button>
</nav>

<div class="scrim" id="scrim"></div>

<!-- sheet: expense -->
<div class="sheet" id="sheet-exp" role="dialog" aria-modal="true">
  <div class="grip"></div><h2 id="exp-title">Новый расход</h2>
  <div class="field"><label for="f-amount">Сумма</label><div class="amount-wrap"><input id="f-amount" inputmode="decimal" placeholder="0" autocomplete="off"><span>₼</span></div></div>
  <div class="field"><label for="f-text">Что купили</label><input id="f-text" placeholder="лаймы 2 кг, мята" autocomplete="off" maxlength="1000"></div>
  <div class="field"><label>Категория</label><div class="chips" id="cats"></div></div>
  <div class="field" id="f-need-wrap"><label for="f-need">Закрыть заявку № (необязательно)</label><input id="f-need" inputmode="numeric" placeholder="14" autocomplete="off"></div>
  <div class="save-notice" id="save-notice" role="status" hidden></div>
  <div class="actions"><button class="btn danger" id="exp-delete" hidden>Удалить</button><button class="btn" data-close>Отмена</button><button class="btn primary" id="exp-save">Записать</button></div>
</div>

<!-- sheet: new need -->
<div class="sheet" id="sheet-need" role="dialog" aria-modal="true">
  <div class="grip"></div><h2>Новая заявка</h2>
  <div class="field"><label for="n-text">Что нужно</label><input id="n-text" placeholder="нет горячей воды / Campari 2 бут" autocomplete="off"></div>
  <div class="field"><label>Тип</label><div class="chips" id="n-types"></div></div>
  <div class="actions"><button class="btn" data-close>Отмена</button><button class="btn primary" id="need-save">Создать</button></div>
</div>

<!-- sheet: close need -->
<div class="sheet" id="sheet-close" role="dialog" aria-modal="true">
  <div class="grip"></div><h2 id="close-title">Заявка</h2>
  <p id="close-text" style="margin:-6px 0 14px;color:var(--muted);font-size:14px"></p>
  <div class="field"><label for="c-amount">Потратили (пусто — просто закрыть)</label><div class="amount-wrap"><input id="c-amount" inputmode="decimal" placeholder="0" autocomplete="off"><span>₼</span></div></div>
  <div class="field"><label for="c-text">Что купили</label><input id="c-text" autocomplete="off" maxlength="1000"></div>
  <div class="save-notice" id="close-notice" role="status" hidden></div>
  <div class="actions"><button class="btn" data-close>Отмена</button><button class="btn primary" id="close-save">Закрыть заявку</button></div>
</div>
<div class="toast" id="toast"></div>

<script>
const API = "https://worker-production-0beb.up.railway.app";
const CAT = {
  "бар":{icon:"🍾",bg:"var(--gold-bg)",color:"var(--gold)"}, "расходники":{icon:"🧻",bg:"var(--blue-bg)",color:"#8FB3C9"},
  "ремонт":{icon:"🔧",bg:"var(--red-bg)",color:"var(--accent)"}, "оборудование":{icon:"📦",bg:"var(--grey-bg)",color:"#9A8E84"},
  "прочее":{icon:"•",bg:"var(--grey-bg)",color:"#C9BDB0"}, "без описания":{icon:"❔",bg:"var(--gold-bg)",color:"var(--gold-ink)"},
};
const NEED = {
  "поломка":{icon:"🔧",bg:"var(--red-bg)",ink:"var(--red-ink)"}, "оборудование":{icon:"📦",bg:"var(--grey-bg)",ink:"var(--grey-ink)"},
  "бар":{icon:"🍾",bg:"var(--gold-bg)",ink:"var(--gold-ink)"}, "расходник":{icon:"🧻",bg:"var(--blue-bg)",ink:"var(--blue-ink)"},
};
const TITLES = {expenses:"Расходы", needs:"Заявки", stop:"Стоп-лист", specs:"Спеки"};
const tg = window.Telegram && window.Telegram.WebApp;
const initData = tg && tg.initData || "";
const devToken = new URLSearchParams(location.search).get("dev") || "";
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
let screen = "expenses", period = "day", editing = null, category = null, needType = null, needFilter = "", closing = null;
let specs = [], stopState = null, openSheet = null;
let saving = false, pendingCreate = null, pendingStorageKey = "", refreshTimer = null;
let pendingClose = null, pendingCloseKey = "";   // незавершённое «Закрыл + расход»: {key, needId, body:{amount,text}}

const money = x => (Math.round(x*100)/100).toLocaleString("ru-RU",{maximumFractionDigits:2}) + " ₼";
const esc = s => String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const plural = (n,f) => { const a=n%10,b=n%100; return (a===1&&b!==11)?f[0]:(a>=2&&a<=4&&(b<10||b>=20))?f[1]:f[2]; };
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("show"); setTimeout(()=>el.classList.remove("show"),2000); }
function haptic(k){ try{ tg&&tg.HapticFeedback&&(k==="ok"?tg.HapticFeedback.notificationOccurred("success"):tg.HapticFeedback.impactOccurred("light")); }catch(e){} }
async function api(path, opts={}){
  const headers={"Content-Type":"application/json", ...(opts.headers||{})};
  if (initData) headers["X-Telegram-Init-Data"]=initData;
  if (devToken) headers["X-Dev-Token"]=devToken;
  const controller = new AbortController(); const timer = setTimeout(()=>controller.abort(), 15000);
  try{
    const r = await fetch(API+path,{...opts,headers,signal:controller.signal});
    const data = await r.json().catch(()=>({}));
    if(!r.ok){ const err=new Error(data.error||("Ошибка "+r.status)); err.status=r.status; throw err; }
    return data;
  } finally { clearTimeout(timer); }
}
function newKey(){ return (crypto.randomUUID ? crypto.randomUUID() : ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16))); }
function savePending(draft){ try{ localStorage.setItem(pendingStorageKey, JSON.stringify(draft)); return true; }catch(e){ return false; } }
function forgetPending(){ pendingCreate=null; try{ localStorage.removeItem(pendingStorageKey); }catch(e){} }
function savePendingClose(d){ try{ localStorage.setItem(pendingCloseKey, JSON.stringify(d)); return true; }catch(e){ return false; } }
function forgetPendingClose(){ pendingClose=null; try{ localStorage.removeItem(pendingCloseKey); }catch(e){} }
function readStored(key, check){ try{ const raw=localStorage.getItem(key); if(!raw) return null; const d=JSON.parse(raw); return check(d) ? d : null; }catch(e){ return null; } }

/* ---------- navigation ---------- */
function go(s){
  screen = s; if (location.hash !== "#"+s) history.replaceState(null, "", "#"+s);
  $$(".screen").forEach(x => x.classList.toggle("active", x.id === "scr-"+s));
  $$("nav.bottom button").forEach(b => { if (b.dataset.screen===s) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  $("#title").textContent = TITLES[s];
  $("#fab").hidden = !(s==="expenses" || s==="needs");
  ({expenses:loadExpenses, needs:loadNeeds, stop:loadStop, specs:loadSpecs})[s]();
  window.scrollTo(0,0);
}

/* ---------- sheets ---------- */
function show(id){ openSheet=id; $("#scrim").classList.add("open"); $(id).classList.add("open"); tg&&tg.BackButton&&tg.BackButton.show(); }
function hide(){ if(!openSheet || saving) return; $("#scrim").classList.remove("open"); $(openSheet).classList.remove("open"); openSheet=null; editing=null; closing=null; tg&&tg.BackButton&&tg.BackButton.hide(); }

/* ---------- expenses ---------- */
async function loadExpenses(){
  try{
    const d = await api("/api/expenses?period="+period);
    clearTimeout(refreshTimer);
    if (d.items.some(it=>it.notification_status==="pending"||it.need_status==="pending")) refreshTimer=setTimeout(loadExpenses,30000);
    $("#resume").hidden = !pendingCreate;
    $("#period-label").textContent = {day:"Сегодня",week:"7 дней",month:"Месяц"}[d.period];
    $("#month-total").textContent = "за месяц "+money(d.month_total);
    $("#total").textContent = money(d.total);
    $("#count").textContent = d.count+" "+plural(d.count,["запись","записи","записей"]);
    $("#pending").textContent = d.pending ? "❓ без суммы: "+d.pending : "";
    const cats = Object.entries(d.by_category);
    $("#bar").innerHTML = cats.map(([c,v])=>`<div style="flex:${v} 0 0;background:${(CAT[c]||CAT["прочее"]).color}"></div>`).join("");
    $("#legend").innerHTML = cats.map(([c,v])=>`<span><i style="background:${(CAT[c]||CAT["прочее"]).color}"></i>${c} ${money(v)}</span>`).join("");
    const list=$("#exp-list");
    if(!d.items.length){ list.innerHTML=`<div class="empty">Пока пусто. Плюс внизу — первая запись.</div>`; return; }
    list.innerHTML = d.items.map(it=>{ const c=CAT[it.category]||CAT["прочее"];
      const need = it.need_id ? "заявка #"+it.need_id+(it.need_status==="pending"?" · закрывается":it.need_status==="not_found"?" · не найдена":"") : "";
      const meta=[it.who, it.date.slice(0,5)+" "+it.date.slice(11), need, it.photo?"чек":""].filter(Boolean).join(" · ");
      const delivery = it.notification_status==="pending" ? `<div class="delivery">сохранено · пост в Telegram в очереди</div>` : "";
      return `<button class="item" data-id="${it.id}"><div class="ic" style="background:${c.bg}">${c.icon}</div><div class="body"><div class="t">${esc(it.text)}</div><div class="m">${esc(meta)}</div>${delivery}</div><div class="amt">${money(it.amount)}</div></button>`; }).join("");
    list.querySelectorAll(".item").forEach(b=>b.addEventListener("click",()=>openExpense(d.items.find(i=>i.id==b.dataset.id))));
  }catch(e){ toast(e.message); }
}
function renderCats(){
  $("#cats").innerHTML = `<button class="chip" data-cat="" aria-pressed="${category===null}">авто</button>`+
    Object.keys(CAT).filter(c=>c!=="без описания").map(c=>`<button class="chip" data-cat="${c}" aria-pressed="${category===c}">${CAT[c].icon} ${c}</button>`).join("");
  $("#cats").querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{ category=b.dataset.cat||null; renderCats(); haptic(); }));
}
function updateSaveState(){
  const locked = saving || !!pendingCreate;
  ["#f-amount","#f-text","#f-need"].forEach(id=>$(id).disabled=locked);
  $("#cats").querySelectorAll(".chip").forEach(b=>b.disabled=locked);
  $("#exp-save").disabled = saving; $("#exp-delete").disabled = saving;
  $("#exp-save").textContent = saving ? "Сохраняем…" : pendingCreate ? "Проверить сохранение" : editing ? "Сохранить" : "Записать";
  $("#resume").hidden = !pendingCreate;
}
function openExpense(item){
  if (saving) return;
  if (pendingCreate) item = null;
  editing=item||null;
  $("#exp-title").textContent = item ? "Запись #"+item.id : "Новый расход";
  $("#f-amount").value = item ? item.amount : ""; $("#f-text").value = item ? item.text : ""; $("#f-need").value = item ? (item.need_id||"") : "";
  $("#f-need-wrap").hidden = !!item; category = item ? item.category : null;
  if (pendingCreate){ $("#f-amount").value=pendingCreate.body.amount; $("#f-text").value=pendingCreate.body.text; $("#f-need").value=pendingCreate.body.need_id||""; category=pendingCreate.body.category; }
  renderCats();
  $("#exp-delete").hidden = !item;
  $("#save-notice").hidden = !pendingCreate;
  $("#save-notice").textContent = pendingCreate ? "Ответ о сохранении не получен. Нажми «Проверить сохранение» — повторной записи не будет." : "";
  updateSaveState();
  show("#sheet-exp"); setTimeout(()=>(item?$("#f-text"):$("#f-amount")).focus(),250);
}
async function saveExpense(){
  if (saving || openSheet!=="#sheet-exp") return;
  const amount=Number($("#f-amount").value.replace(",",".")), text=$("#f-text").value.trim();
  if(!Number.isFinite(amount)||!(amount>0)) return toast("Сумма — число больше нуля");
  if(!text||text.length>1000) return toast("Напиши, что купили (до 1000 символов)");
  const wasEditing=!!editing;
  if(!wasEditing && !pendingCreate){
    const need_id=$("#f-need").value.trim().replace(/^#/,"");
    if(need_id && !/^[0-9]{1,15}$/.test(need_id)) return toast("Номер заявки — целое число");
    const draft={key:newKey(), body:{amount,text,category,need_id}};
    if(!savePending(draft)) return toast("Не удалось сохранить черновик на устройстве — разреши хранилище");
    pendingCreate=draft;
  }
  saving=true; updateSaveState(); $("#save-notice").hidden=true;
  try{
    let result;
    if(wasEditing) await api("/api/expenses/"+editing.id,{method:"PATCH",body:JSON.stringify({amount,text,category})});
    else { result=await api("/api/expenses",{method:"POST",headers:{"Idempotency-Key":pendingCreate.key},body:JSON.stringify(pendingCreate.body)});
      if(!Number.isInteger(result.id)) throw new Error("Нет подтверждения сохранения"); forgetPending(); }
    saving=false; updateSaveState(); haptic("ok"); hide(); await loadExpenses();
    toast(result&&result.deleted ? "Эта покупка уже была сохранена и удалена" : wasEditing ? "Сохранено" : "Записано");
  }catch(e){
    if(!wasEditing && e.status===400) forgetPending();           // только валидация доказывает, что записи нет
    $("#save-notice").hidden=false;
    $("#save-notice").textContent = pendingCreate ? "Ответ о сохранении не получен. Нажми «Проверить сохранение» — повторной записи не будет." : e.message;
  } finally { saving=false; updateSaveState(); }
}
async function deleteExpense(){ if(!editing||saving) return; try{ await api("/api/expenses/"+editing.id,{method:"DELETE"}); haptic("ok"); hide(); await loadExpenses(); toast("Удалено"); }catch(e){ toast(e.message); } }

/* ---------- audit ---------- */
const ACT = {expense_add:"добавил расход", expense_edit:"изменил расход", expense_delete:"удалил расход", stop_add:"поставил в стоп", stop_remove:"снял со стопа", need_add:"создал заявку", need_close:"закрыл заявку"};
async function loadAudit(){
  const list=$("#audit-list");
  try{ const d=await api("/api/audit?limit=40");
    list.innerHTML = d.items.length ? d.items.map(a=>{ const what = a.entity==="stop" ? a.entity_id : "#"+a.entity_id; const det = a.action==="expense_edit" ? `${esc(a.before)} → ${esc(a.after)}` : esc(a.after||a.before);
      return `<div class="log"><b>${esc(a.who)}</b> ${ACT[a.action]||esc(a.action)} ${esc(what)}${det?" · "+det:""}<div class="when">${esc(String(a.at).slice(0,5))} ${esc(String(a.at).slice(11))} · ${a.source==="app"?"приложение":"Telegram"}</div></div>`; }).join("")
      : `<div class="empty">Журнал пуст</div>`; }
  catch(e){ toast(e.message); }
}

/* ---------- needs ---------- */
async function loadNeeds(){
  try{
    const d = await api("/api/needs");
    const types=["","поломка","бар","оборудование","расходник"];
    $("#need-filters").innerHTML = types.map(t=>`<button class="tab" data-type="${t}" aria-pressed="${needFilter===t}">${t||"Все · "+d.items.length}</button>`).join("");
    $("#need-filters").querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{ needFilter=b.dataset.type; haptic(); loadNeeds(); }));
    const items = d.items.filter(i=>!needFilter||i.type===needFilter);
    const list=$("#need-list");
    const banner = pendingClose ? `<button class="btn resume" id="close-resume">Проверить сохранение по заявке #${pendingClose.needId}</button>` : "";
    if(!items.length){ list.innerHTML=banner+`<div class="empty">Открытых заявок нет</div>`; bindCloseResume(); return; }
    list.innerHTML = banner + items.map(it=>{ const n=NEED[it.type]||NEED["расходник"];
      return `<div class="card"><div class="top"><span><span class="badge" style="background:${n.bg};color:${n.ink}">${esc(it.type)}</span>&nbsp; #${it.id} · ${esc(it.created)}</span><span>${esc(it.who)}</span></div>
        <div class="text">${esc(it.text)}</div>
        <div class="row2"><button class="btn primary" data-close-id="${it.id}" data-mode="plain">Закрыл</button><button class="btn" data-close-id="${it.id}" data-mode="spend">Закрыл + расход</button></div></div>`; }).join("");
    list.querySelectorAll("[data-close-id]").forEach(b=>b.addEventListener("click",()=>openClose(items.find(i=>i.id==b.dataset.closeId), b.dataset.mode)));
    bindCloseResume();
  }catch(e){ toast(e.message); }
}
function bindCloseResume(){ const b=$("#close-resume"); if(b) b.addEventListener("click",()=>openClose({id:pendingClose.needId, text:pendingClose.body.text}, "spend")); }
function renderNeedTypes(){
  $("#n-types").innerHTML = `<button class="chip" data-t="" aria-pressed="${needType===null}">авто</button>`+Object.keys(NEED).map(t=>`<button class="chip" data-t="${t}" aria-pressed="${needType===t}">${NEED[t].icon} ${t}</button>`).join("");
  $("#n-types").querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{ needType=b.dataset.t||null; renderNeedTypes(); haptic(); }));
}
function openNeed(){ $("#n-text").value=""; needType=null; renderNeedTypes(); show("#sheet-need"); setTimeout(()=>$("#n-text").focus(),250); }
async function saveNeed(){
  if (saving || openSheet!=="#sheet-need") return;
  const text=$("#n-text").value.trim(); if(!text) return toast("Напиши, что нужно");
  saving=true; $("#need-save").disabled=true;
  try{ const r=await api("/api/needs",{method:"POST",body:JSON.stringify({text,type:needType})}); saving=false; haptic("ok"); hide(); await loadNeeds(); toast("Заявка #"+r.id+" · "+r.type); }
  catch(e){ toast(e.message); } finally{ saving=false; $("#need-save").disabled=false; }
}
function updateCloseState(){
  const locked = saving || !!pendingClose;
  $("#c-amount").disabled = locked; $("#c-text").disabled = locked;
  $("#close-save").disabled = saving;
  $("#close-save").textContent = saving ? "Сохраняем…" : pendingClose ? "Проверить сохранение" : "Закрыть заявку";
}
async function openClose(item, mode){
  if (saving) return;
  if(mode==="plain"){
    saving=true;
    try{ await api(`/api/needs/${item.id}/close`,{method:"POST",body:"{}"}); haptic("ok"); await loadNeeds(); toast("#"+item.id+" закрыта"); }
    catch(e){ toast(e.message); } finally{ saving=false; }
    return;
  }
  if (pendingClose && pendingClose.needId !== item.id){ toast("Сначала подтверди запись по заявке #"+pendingClose.needId); item={id:pendingClose.needId, text:pendingClose.body.text}; }
  closing=item;
  $("#close-title").textContent="Заявка #"+item.id; $("#close-text").textContent=item.text;
  $("#c-amount").value = pendingClose ? pendingClose.body.amount : ""; $("#c-text").value = pendingClose ? pendingClose.body.text : item.text;
  $("#close-notice").hidden = !pendingClose;
  $("#close-notice").textContent = pendingClose ? "Ответ о сохранении не получен. Нажми «Проверить сохранение» — повторной записи не будет." : "";
  updateCloseState();
  show("#sheet-close"); setTimeout(()=>$("#c-amount").focus(),250);
}
async function saveClose(){
  if(!closing||saving||openSheet!=="#sheet-close") return;
  const amount=$("#c-amount").value.replace(",","."), text=$("#c-text").value.trim();
  const id=closing.id;
  if(!pendingClose){
    if(amount && !(Number(amount)>0)) return toast("Сумма — число больше нуля");
    if(amount && !text) return toast("Напиши, что купили");
    if(amount){ const draft={key:newKey(), needId:id, body:{amount,text}}; if(!savePendingClose(draft)) return toast("Не удалось сохранить черновик на устройстве — разреши хранилище"); pendingClose=draft; }
  }
  saving=true; updateCloseState(); $("#close-notice").hidden=true;
  try{
    if(pendingClose) await api(`/api/needs/${pendingClose.needId}/close`,{method:"POST",headers:{"Idempotency-Key":pendingClose.key},body:JSON.stringify(pendingClose.body)});
    else await api(`/api/needs/${id}/close`,{method:"POST",body:"{}"});
    const spent=!!pendingClose; forgetPendingClose();
    saving=false; updateCloseState(); haptic("ok"); hide(); await loadNeeds(); toast("#"+id+" закрыта"+(spent?", расход записан":""));
  }catch(e){
    if(e.status===400) forgetPendingClose();                    // только валидация доказывает, что записи нет
    $("#close-notice").hidden=false;
    $("#close-notice").textContent = pendingClose ? "Ответ о сохранении не получен. Нажми «Проверить сохранение» — повторной записи не будет." : e.message;
  } finally { saving=false; updateCloseState(); }
}

/* ---------- stop ---------- */
async function loadStop(){ try{ stopState = await api("/api/stop"); renderStop(); }catch(e){ toast(e.message); } }
function renderStop(){
  const q = $("#stop-q").value.trim().toLowerCase(); const d = stopState; if(!d) return;
  $("#stop-count").textContent = d.stop.length ? d.stop.length+" "+plural(d.stop.length,["позиция","позиции","позиций"]) : "пусто";
  const stop = d.stop.filter(s=>!q||s.item.toLowerCase().includes(q));
  $("#stop-list").innerHTML = stop.length ? stop.map(s=>`<div class="stoprow"><div class="hd"><div><div class="nm">${esc(s.item)}</div><div class="sub">с ${esc(s.since)} · ${esc(s.who)}</div></div>
    <button class="toggle" role="switch" aria-checked="true" data-item="${esc(s.item)}" data-on="0" aria-label="снять со стопа"><span></span></button></div>
    ${s.affected.length?`<div class="tags">${s.affected.slice(0,6).map(a=>`<span class="tag">${esc(a)}</span>`).join("")}${s.affected.length>6?`<span class="tag">+${s.affected.length-6}</span>`:""}</div>`:""}</div>`).join("")
    : `<div class="empty">${q?"Нет совпадений в стопе":"✅ Всё на баре"}</div>`;
  const ings = d.ingredients.filter(i=>!q||i.includes(q)).slice(0,40);
  $("#ing-list").innerHTML = ings.map(i=>`<div class="ingrow"><span>${esc(i)}</span><button class="toggle" role="switch" aria-checked="false" data-item="${esc(i)}" data-on="1" aria-label="в стоп"><span></span></button></div>`).join("");
  const custom = $("#stop-add-custom");
  custom.hidden = !(q.length>1 && !d.ingredients.includes(q) && !d.stop.some(s=>s.item.toLowerCase()===q));
  custom.textContent = "«"+q+"» в стоп";
  $$("#scr-stop .toggle").forEach(b=>b.addEventListener("click",()=>toggleStop(b.dataset.item, b.dataset.on==="1", b)));
}
async function toggleStop(item, on, btn){
  if(btn){ btn.disabled=true; btn.setAttribute("aria-checked", on?"true":"false"); }
  try{ const r=await api("/api/stop",{method:"POST",body:JSON.stringify({item,on})}); haptic("ok");
    if(on) toast(r.already ? "уже в стопе" : (r.affected.length ? "Падают: "+r.affected.slice(0,4).join(", ")+(r.affected.length>4?"…":"") : "В стопе"));
    else toast("Снято со стопа");
    $("#stop-q").value=""; await loadStop(); }
  catch(e){ toast(e.message); renderStop(); }
}

/* ---------- specs ---------- */
async function loadSpecs(){
  if(specs.length){ renderSpecHits(); return; }
  try{ specs = (await api("/api/specs")).items; renderSpecHits(); }catch(e){ toast(e.message); }
}
const nrm = s => String(s).toLowerCase().replace(/ё/g,"е").trim();
function specMatches(q){
  if(!q) return specs.slice(0,8);
  return specs.map(s=>{ const keys=[s.name,...s.aliases].map(nrm); let sc=0;
    for(const k of keys){ if(k===q) sc=Math.max(sc,3); else if(k.startsWith(q)) sc=Math.max(sc,2); else if(k.includes(q)) sc=Math.max(sc,1); else if(q.length>3 && k.split(" ").some(w=>w.startsWith(q.slice(0,4)))) sc=Math.max(sc,.5); }
    return [sc,s]; }).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).slice(0,8).map(x=>x[1]);
}
function renderSpecHits(){
  const q=nrm($("#spec-q").value); const hits=specMatches(q);
  $("#spec-hits").innerHTML = hits.map((s,i)=>`<button class="chip" data-i="${i}" aria-pressed="${i===0}">${esc(s.name)}</button>`).join("") || `<div class="empty" style="width:100%">Не нашёл. Попробуй другое написание</div>`;
  $("#spec-hits").querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{ $("#spec-hits").querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed","false")); b.setAttribute("aria-pressed","true"); renderSpec(hits[+b.dataset.i]); }));
  renderSpec(hits[0]);
}
function renderSpec(s){
  const el=$("#spec-card"); if(!s){ el.innerHTML=""; return; }
  const ings = s.ingredients.map(p=>{
    const m=p.match(/^(.*?)\s+(\d[\d.,\/]*\s*(?:мл|дэш\w*|капл\w*|шт|ч\.?л\.?|б\.?л\.?)?|топ)$/i);
    const name=m?m[1]:p, qty=m?m[2]:"";
    const dead=s.dead.some(d=>nrm(name).includes(d)||d.includes(nrm(name)));
    return `<div class="ing${dead?" dead":""}"><span>${esc(name)}</span><b>${esc(qty)}</b></div>`; }).join("");
  el.innerHTML = `<div class="spec"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px"><div><h2>${esc(s.name)}</h2><div class="sub">${esc([s.aliases[0], ...s.tags].filter(Boolean).join(" · "))}</div></div>
    ${s.method?`<span class="badge" style="background:var(--gold-bg);color:var(--gold-ink);white-space:nowrap">${esc(s.method.split(";")[0])}</span>`:""}</div>
    <div>${ings}</div>
    <div class="meta"><div><label>Метод</label><span>${esc(s.method||"—")}</span></div><div><label>Бокал</label><span>${esc(s.glass||"—")}</span></div><div><label>Гарнир</label><span>${esc(s.garnish||"—")}</span></div></div>
    ${s.pitch?`<div class="pitch">💬 ${esc(s.pitch)}</div>`:""}
    ${s.dead.length?`<div class="tags"><span class="tag">⛔ в стопе: ${esc(s.dead.join(", "))}</span></div>`:""}</div>`;
}

/* ---------- boot & events ---------- */
async function boot(){
  if(tg){ tg.ready(); tg.expand(); tg.BackButton&&tg.BackButton.onClick(hide); }
  if(!initData && !devToken){ $("#gate").hidden=false; return; }
  try{ const me=await api("/api/me"); $("#eyebrow").textContent="Bakılı · "+(me.user.first_name||"команда");
    pendingStorageKey="barbot:pending-expense:"+me.user.id; pendingCloseKey="barbot:pending-close:"+me.user.id;
    pendingCreate = readStored(pendingStorageKey, d=>d&&typeof d.key==="string"&&d.body&&Number.isFinite(d.body.amount)&&typeof d.body.text==="string");
    pendingClose = readStored(pendingCloseKey, d=>d&&typeof d.key==="string"&&Number.isInteger(d.needId)&&d.body&&typeof d.body.amount==="string"&&typeof d.body.text==="string");
    $("#app").hidden=false; $("#nav").hidden=false;
    const h=location.hash.replace("#",""); go(pendingCreate ? "expenses" : pendingClose ? "needs" : (TITLES[h]?h:"expenses"));
    if(pendingCreate) openExpense(null); else if(pendingClose) openClose({id:pendingClose.needId, text:pendingClose.body.text}, "spend"); }
  catch(e){ $("#gate").hidden=false; $("#gate-text").textContent=e.message; }
}
$$("nav.bottom button").forEach(b=>b.addEventListener("click",()=>{ haptic(); go(b.dataset.screen); }));
$$("#scr-expenses .tab").forEach(b=>b.addEventListener("click",()=>{ period=b.dataset.period; $$("#scr-expenses .tab").forEach(x=>x.setAttribute("aria-pressed",x===b)); haptic(); loadExpenses(); }));
$("#fab").addEventListener("click",()=> screen==="expenses" ? openExpense(null) : openNeed());
$("#resume").addEventListener("click",()=>openExpense(null));
$("#audit-toggle").addEventListener("click",()=>{ const l=$("#audit-list"); l.hidden=!l.hidden; $("#audit-toggle").textContent=l.hidden?"показать":"скрыть"; if(!l.hidden) loadAudit(); });
$("#scrim").addEventListener("click",hide); $$("[data-close]").forEach(b=>b.addEventListener("click",hide));
$("#exp-save").addEventListener("click",saveExpense); $("#exp-delete").addEventListener("click",deleteExpense);
$("#need-save").addEventListener("click",saveNeed); $("#close-save").addEventListener("click",saveClose);
$("#f-amount").addEventListener("keydown",e=>{ if(e.key==="Enter") $("#f-text").focus(); });
$("#f-text").addEventListener("keydown",e=>{ if(e.key==="Enter") saveExpense(); });
$("#n-text").addEventListener("keydown",e=>{ if(e.key==="Enter") saveNeed(); });
$("#stop-q").addEventListener("input",renderStop);
$("#stop-add-custom").addEventListener("click",()=>toggleStop($("#stop-q").value.trim(),true,null));
$("#spec-q").addEventListener("input",renderSpecHits);
boot();
</script>
